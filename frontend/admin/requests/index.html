<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Requests | EcoPickup Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body data-role="admin" data-page="admin-requests" data-layout="sidebar">
  <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" id="dashboard-sidebar">
      <a class="sidebar-brand" href="/"><span class="sidebar-brand-mark">E</span><div><strong>EcoPickup</strong><div class="sidebar-role-badge">Admin</div></div></a>
      <nav class="sidebar-nav">
        <a href="/dashboard/admin/"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="/admin/requests/" class="active"><span class="nav-icon">📋</span> Requests</a>
        <a href="/admin/workers/"><span class="nav-icon">👷</span> Workers</a>
        <a href="/admin/users/"><span class="nav-icon">👥</span> Users</a>
        <div class="sidebar-divider"></div>
      </nav>
      <div class="sidebar-footer">
        <button class="dark-mode-toggle" id="dark-mode-toggle"><span class="nav-icon" id="dark-mode-icon">🌙</span><span id="dark-mode-label">Dark Mode</span></button>
        <button class="dark-mode-toggle" id="dashboard-logout"><span class="nav-icon">🚪</span> Logout</button>
      </div>
    </aside>

    <main class="dashboard-main">
      <div class="breadcrumbs"><a href="/dashboard/admin/">Admin</a><span class="sep">›</span><span>Requests</span></div>
      <header class="dashboard-topbar">
        <div class="topbar-copy"><p>Manage all requests</p><h1>Requests</h1></div>
        <div class="topbar-meta">
          <div class="topbar-chip"><span id="dashboard-user-role">admin</span><strong id="dashboard-date"></strong></div>
          <div class="topbar-chip"><strong id="dashboard-user-name">Admin</strong></div>
        </div>
      </header>

      <section class="dashboard-section">
        <article class="card">
          <div class="card-header"><h3>All Requests</h3><span class="card-badge" id="requests-count-badge"></span></div>
          <div class="filter-bar">
            <input type="search" id="request-search" placeholder="🔍 Search requests..." />
            <select id="filter-status"><option value="">All Status</option><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option><option value="Cancelled">Cancelled</option></select>
            <select id="filter-assignment"><option value="">All</option><option value="assigned">Assigned</option><option value="unassigned">Unassigned</option></select>
          </div>
          <div class="table-wrapper">
            <table class="table-shell">
              <thead><tr><th>ID</th><th>Description</th><th>Area</th><th>Status</th><th>Assigned</th><th>Action</th></tr></thead>
              <tbody id="admin-requests-table-body"><tr><td colspan="6">Loading...</td></tr></tbody>
            </table>
          </div>
          <div class="pagination" id="requests-pagination"></div>
          <p id="page-status-message" class="form-status" aria-live="polite"></p>
        </article>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="request-detail-modal">
    <div class="modal-content" style="position:relative">
      <button class="modal-close" id="close-detail-modal">×</button>
      <h3>Request Details</h3>
      <div id="request-detail-body">Loading...</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared-utils.js"></script>
  <script src="/request-pages.js"></script>
</body>
</html>
